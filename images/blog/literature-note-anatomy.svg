<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Anatomy of one literature note: metadata, Claude-drafted summary, and your own critique and links">
  <defs>
    <filter id="sn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="820" height="470" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1f2328">Anatomy of one literature note</text>
  <text x="40" y="70" font-size="14" fill="#5b6570">A repeatable template. Claude fills the grey; you own the teal.</text>

  <!-- the note card -->
  <g filter="url(#sn)"><rect x="40" y="92" width="470" height="350" rx="12" fill="#ffffff" stroke="#e2e8e8"/></g>

  <!-- frontmatter -->
  <rect x="40" y="92" width="470" height="66" rx="12" fill="#f5f8f8"/>
  <text x="60" y="118" font-family="monospace" font-size="12.5" fill="#5b6570">tags: [world-model, diffusion]</text>
  <text x="60" y="138" font-family="monospace" font-size="12.5" fill="#5b6570">year: 2026 · status: read · rating: ★★★★</text>

  <text x="60" y="186" font-size="15" font-weight="700" fill="#1f2328">Physics-guided Video Diffusion</text>

  <text x="60" y="214" font-size="12.5" font-weight="700" fill="#124b54">TL;DR</text>
  <text x="60" y="234" font-size="12.5" fill="#5b6570">Conditions a video model on optical flow so</text>
  <text x="60" y="252" font-size="12.5" fill="#5b6570">contacts stay stable over long horizons.</text>

  <text x="60" y="284" font-size="12.5" font-weight="700" fill="#124b54">Problem · Method · Results</text>
  <text x="60" y="304" font-size="12.5" fill="#5b6570">drift → flow-conditioning → +X on the</text>
  <text x="60" y="322" font-size="12.5" fill="#5b6570">long-horizon consistency benchmark.</text>

  <text x="60" y="354" font-size="12.5" font-weight="700" fill="#1f6f7c">My take ✎</text>
  <text x="60" y="374" font-size="12.5" fill="#1f2328">Ablation is thin — does it use flow, or</text>
  <text x="60" y="392" font-size="12.5" fill="#1f2328">just more params? Test with mismatched flow.</text>

  <text x="60" y="422" font-size="12.5" fill="#1f6f7c" font-weight="600">Links: [[flow-conditioning]] · [[my-idea-03]]</text>

  <!-- callouts on the right -->
  <g font-size="13">
    <line x1="510" y1="125" x2="560" y2="125" stroke="#cfe0e0" stroke-width="1.5"/>
    <rect x="560" y="108" width="228" height="36" rx="9" fill="#f5f8f8" stroke="#e2e8e8"/>
    <text x="574" y="131" fill="#5b6570">Metadata → searchable &amp; filterable</text>

    <line x1="510" y1="224" x2="560" y2="224" stroke="#cfe0e0" stroke-width="1.5"/>
    <rect x="560" y="198" width="228" height="54" rx="9" fill="#eef4f4" stroke="#cfe0e0"/>
    <text x="574" y="220" fill="#124b54" font-weight="700">Claude-drafted</text>
    <text x="574" y="240" fill="#5b6570" font-size="12">summary you verify against the PDF</text>

    <line x1="510" y1="364" x2="560" y2="364" stroke="#cfe0e0" stroke-width="1.5"/>
    <rect x="560" y="330" width="228" height="72" rx="9" fill="#124b54"/>
    <text x="574" y="354" fill="#ffffff" font-weight="700">This part is yours</text>
    <text x="574" y="374" fill="#dcecec" font-size="12">critique + links are where</text>
    <text x="574" y="391" fill="#dcecec" font-size="12">ideas actually come from</text>
  </g>
</svg>
